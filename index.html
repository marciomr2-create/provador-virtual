<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Provador Digital.AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Dark Theme with Gold and Teal Accents */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #111827; /* Tailwind bg-gray-900 */
            color: #fcd34d; /* Tailwind amber-300 */
        }

        /* Painel Style (Consolidated & Reduced) */
        .panel {
            background-color: #1f2937; /* gray-800 */
            border-radius: 0.5rem;
            padding: 1rem; /* Reduced from 1.5rem */
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06);
        }

        /* Upload Area Style (Reduced) */
        .upload-area {
            border: 2px dashed #4b5563; /* border-dashed border-gray-600 */
            border-radius: 0.5rem; /* rounded-lg */
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 120px; /* Reduced from 150px */
            background-color: #374151; /* bg-gray-700 */
            color: #d1d5db; /* text-gray-300 */
            cursor: pointer;
            transition: background-color 0.2s, border-color 0.2s;
        }
        .upload-area:hover {
            background-color: #4b5563; /* bg-gray-600 */
            border-color: #f59e0b; /* border-amber-500 */
        }

        /* Primary Button (Consolidated & Reduced) */
        .btn-primary {
            background-color: #0d9488; /* teal-600 */
            color: white;
            font-weight: 600;
            padding: 0.5rem 0.875rem; /* Reduced */
            font-size: 0.875rem; /* Smaller font */
            border-radius: 0.5rem;
            transition: background-color 0.2s;
        }
        .btn-primary:hover:not(:disabled) {
            background-color: #0f766e; /* teal-700 */
        }
        .btn-primary:disabled {
            background-color: #4b5563; /* gray-600 */
            color: #6b7280;
            cursor: not-allowed;
        }

        /* Secondary Button (Consolidated & Reduced) */
        .btn-secondary {
            background-color: #4b5563; /* gray-600 */
            color: #e5e7eb; /* gray-200 */
            font-weight: 600;
            padding: 0.375rem 0.75rem; /* Reduced */
            font-size: 0.875rem; /* Smaller font */
            border-radius: 0.5rem;
            transition: background-color 0.2s;
            border: none;
        }
        .btn-secondary:hover:not(:disabled) {
            background-color: #374151; /* gray-700 */
        }
        .btn-secondary:disabled {
            background-color: #374151; /* gray-700 */
            color: #6b7280; /* gray-500 */
            cursor: not-allowed;
        }
    </style>
<script type="importmap">

</head>

    <div id="root"></div>
</body>
</html>

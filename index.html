
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VOFY (MVP) - Provador Digital de Alta Performance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* Light Fashion Theme */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #F6F5F2; 
            color: #2B2B2B;
        }

        .panel {
            background-color: #E8E7E4;
            border-radius: 1rem;
            padding: 1.5rem;
            border: 1px solid rgba(0,0,0,0.05);
            box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.03);
        }

        .upload-area {
            border: 2px dashed #C6B8A6;
            border-radius: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 120px;
            background-color: #FFFFFF;
            color: #7A7A7A;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .upload-area:hover {
            background-color: #FDFBF7;
            border-color: #9FAF9C;
        }

        /* Primary Button - Sand Beige */
        .btn-primary {
            background-color: #C6B8A6;
            color: #ffffff;
            font-weight: 700;
            padding: 1rem 1.5rem;
            font-size: 0.875rem;
            border-radius: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            box-shadow: 0 4px 12px rgba(198, 184, 166, 0.3);
        }
        .btn-primary:hover:not(:disabled) {
            background-color: #b5a896;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(198, 184, 166, 0.4);
        }
        .btn-primary:disabled {
            background-color: #d1d1d1;
            color: #ffffff;
            cursor: not-allowed;
            box-shadow: none;
        }

        .btn-secondary {
            background-color: #FFFFFF;
            color: #2B2B2B;
            font-weight: 600;
            padding: 0.5rem 1rem;
            font-size: 0.875rem;
            border-radius: 0.75rem;
            transition: all 0.3s ease;
            border: 1px solid #E8E7E4;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
    </style>
<script type="importmap">

</head>

    <div id="root"></div>
</body>
</html>

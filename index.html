
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VOFY (MVP) - Provador Digital de Alta Performance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Dark Theme with Luxury Champagne Gold and Off-White Accents */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0a0a0b; 
            color: #FDFBF7; /* Off-White */
        }

        /* Champagne Gold color: #D4AF37 */
        /* Off-White color: #FDFBF7 */

        .panel {
            background-color: #161618;
            border-radius: 0.75rem;
            padding: 1rem;
            border: 1px solid #27272a;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.4);
        }

        .upload-area {
            border: 2px dashed #3f3f46;
            border-radius: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 120px;
            background-color: #111113;
            color: #FDFBF7;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .upload-area:hover {
            background-color: #18181b;
            border-color: #D4AF37;
        }

        /* Primary Button - Champagne Gold */
        .btn-primary {
            background-color: #D4AF37;
            color: #0a0a0b; /* Black text for high contrast on gold */
            font-weight: 800;
            padding: 0.75rem 1.25rem;
            font-size: 0.875rem;
            border-radius: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            transition: all 0.3s ease;
            box-shadow: 0 4px 14px 0 rgba(212, 175, 55, 0.2);
        }
        .btn-primary:hover:not(:disabled) {
            background-color: #e5c05b;
            transform: translateY(-1px);
            box-shadow: 0 6px 20px 0 rgba(212, 175, 55, 0.3);
        }
        .btn-primary:disabled {
            background-color: #3f3f46;
            color: #71717a;
            cursor: not-allowed;
            box-shadow: none;
        }

        /* Secondary Button - Dark with Off-White border */
        .btn-secondary {
            background-color: transparent;
            color: #FDFBF7;
            font-weight: 600;
            padding: 0.5rem 1rem;
            font-size: 0.875rem;
            border-radius: 0.5rem;
            transition: all 0.3s ease;
            border: 1px solid #3f3f46;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .btn-secondary:hover:not(:disabled) {
            background-color: #18181b;
            border-color: #FDFBF7;
        }
    </style>
<script type="importmap">

  }
}
</script>
</head>
<body>
    <div id="root"></div>
</body>
</html>
